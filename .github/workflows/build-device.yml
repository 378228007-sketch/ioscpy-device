name: build-device

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          brew install ldid dpkg xz
          echo "--- versions ---"
          ldid -v || true
          dpkg-deb --version | head -1

      - name: Install Theos + SDKs
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          ls "$HOME/theos/sdks" | head

      - name: Build package (arm64 + arm64e)
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          cd device
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e" -j4 2>&1 | tee /tmp/build.log
          echo "--- packages ---"
          ls -l packages/ || true

      - name: Verify slices
        run: |
          cd device
          for f in $(find .theos -name 'ioscpyhook.dylib' -type f); do
            echo "== $f"
            xcrun lipo -info "$f" || true
            xcrun vtool -show-build "$f" 2>/dev/null | head -8 || true
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-deb
          path: |
            device/packages/*.deb
            device/.theos/obj/**/*.dylib
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn
